<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museo della Cultura e Musica Popolare dei Peloritani — Visita Virtuale</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --bg-dark: #0f1115;
      --bar-bg: #161920;
      --border-color: #262b36;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      height: 52px;
      min-height: 52px;
      background-color: var(--bar-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 12px;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      position: relative;
      z-index: 51;
    }

    .tab-btn, .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      position: relative;
      z-index: 52;
    }

    .tab-btn:hover, .action-btn:hover {
      color: var(--text-main);
      border-color: #3f4756;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    main {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      background: #000;
      z-index: 1;
    }

    body.is-fullscreen header,
    html:fullscreen header,
    body:fullscreen header,
    html:-webkit-full-screen header,
    body:-webkit-full-screen header,
    html:-moz-full-screen header,
    body:-moz-full-screen header {
      display: none !important;
    }

    body.is-fullscreen main,
    html:fullscreen main,
    body:fullscreen main,
    html:-webkit-full-screen main,
    body:-webkit-full-screen main,
    html:-moz-full-screen main,
    body:-moz-full-screen main {
      height: 100vh !important;
      width: 100vw !important;
    }

    .panel {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .panel.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 820px) {
      header {
        height: auto;
        flex-wrap: wrap;
        padding: 8px 12px;
      }
      .brand {
        width: 100%;
      }
      nav {
        width: 100%;
        justify-content: space-between;
      }
      .tab-btn {
        flex: 1;
        justify-content: center;
        padding: 6px 8px;
        font-size: 12px;
      }
      .hide-mobile {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">Museo della Cultura e Musica Popolare dei Peloritani</span>
      <span class="brand-sub">Allestimento e visita virtuale</span>
    </div>

    <nav aria-label="Sezioni progetto">
      <button type="button" class="tab-btn active" data-target="figma">
        1. Presentazione
      </button>
      <button type="button" class="tab-btn" data-target="kuula">
        2. Tour Virtuale 360°
      </button>
      <button type="button" class="tab-btn" data-target="voyager">
        3. Modello 3D
      </button>
      <button type="button" class="action-btn hide-mobile" id="btn-fullscreen" title="Attiva o esci dallo schermo intero">
        ⛶ Schermo intero
      </button>
      <a id="open-direct" class="action-btn hide-mobile" href="https://www.figma.com/proto/RCbz7tdR37fKaC2JMt8dwM/Museo-della-Cultura-e-Musica-Popolare-dei-Peloritani_Allestimento-e-visita-virtuale_Slide?node-id=1-1252&p=f&scaling=contain&content-scaling=fixed&starting-point-node-id=1%3A1252&page-id=0%3A1" target="_blank" rel="noopener" title="Apri la scheda corrente in una nuova finestra">
        Apri esterno ↗
      </a>
    </nav>
  </header>

  <main>
    <!-- SEZIONE 1: FIGMA -->
    <section id="panel-figma" class="panel active">
      <iframe
        src="https://embed.figma.com/proto/RCbz7tdR37fKaC2JMt8dwM/Museo-della-Cultura-e-Musica-Popolare-dei-Peloritani_Allestimento-e-visita-virtuale_Slide?node-id=1-1252&p=f&scaling=contain&content-scaling=fixed&starting-point-node-id=1%3A1252&page-id=0%3A1&embed-host=share&hide-ui=1"
        allowfullscreen>
      </iframe>
    </section>

    <!-- SEZIONE 2: KUULA -->
    <section id="panel-kuula" class="panel">
      <iframe
        id="frame-kuula"
        data-src="https://kuula.co/share/collection/7dZJG?logo=-1&info=0&fs=1&vr=1&initload=0&theme=000000ff&thumbs=-1"
        allow="xr-spatial-tracking; gyroscope; accelerometer; fullscreen"
        allowfullscreen
        scrolling="no">
      </iframe>
    </section>

    <!-- SEZIONE 3: VOYAGER 3D -->
    <section id="panel-voyager" class="panel">
      <iframe
        id="frame-voyager"
        data-src="https://giuseppesantorodesign-web.github.io/dist/voyager-explorer.html?root=models/tusk/&document=tusk.svx.json"
        allow="xr-spatial-tracking; fullscreen"
        allowfullscreen>
      </iframe>
    </section>
  </main>

  <script>
    const directUrls = {
      figma: "https://www.figma.com/proto/RCbz7tdR37fKaC2JMt8dwM/Museo-della-Cultura-e-Musica-Popolare-dei-Peloritani_Allestimento-e-visita-virtuale_Slide?node-id=1-1252&p=f&scaling=contain&content-scaling=fixed&starting-point-node-id=1%3A1252&page-id=0%3A1",
      kuula: "https://kuula.co/share/collection/7dZJG?logo=-1&info=0&fs=1&vr=1&initload=0&theme=000000ff&thumbs=-1",
      voyager: "https://giuseppesantorodesign-web.github.io/dist/voyager-explorer.html?root=models/tusk/&document=tusk.svx.json"
    };

    function switchTab(tabName) {
      if (!tabName) return;

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.target === tabName);
      });

      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === "panel-" + tabName);
      });

      const frame = document.getElementById("frame-" + tabName);
      if (frame && !frame.getAttribute("src") && frame.dataset.src) {
        frame.setAttribute("src", frame.dataset.src);
      }

      const ext = document.getElementById("open-direct");
      if (ext && directUrls[tabName]) {
        ext.href = directUrls[tabName];
      }
    }

    function syncFullscreenClass() {
      const activeFs = Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement
      );
      document.body.classList.toggle("is-fullscreen", activeFs);

      const header = document.querySelector("header");
      const main = document.querySelector("main");
      if (header) {
        header.style.display = activeFs ? "none" : "";
      }
      if (main) {
        main.style.height = activeFs ? "100vh" : "";
        main.style.width = activeFs ? "100vw" : "";
      }
    }

    function toggleFullscreen() {
      const fsElement =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement;

      if (!fsElement) {
        const req =
          document.documentElement.requestFullscreen ||
          document.documentElement.webkitRequestFullscreen ||
          document.documentElement.mozRequestFullScreen;
        if (req) {
          req.call(document.documentElement).catch(() => {});
        }
      } else {
        const exit =
          document.exitFullscreen ||
          document.webkitExitFullscreen ||
          document.mozCancelFullScreen;
        if (exit) {
          exit.call(document).catch(() => {});
        }
      }
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        switchTab(btn.dataset.target);
      });
    });

    const fsBtn = document.getElementById("btn-fullscreen");
    if (fsBtn) {
      fsBtn.addEventListener("click", (e) => {
        e.preventDefault();
        toggleFullscreen();
      });
    }

    document.addEventListener("fullscreenchange", syncFullscreenClass);
    document.addEventListener("webkitfullscreenchange", syncFullscreenClass);
    document.addEventListener("mozfullscreenchange", syncFullscreenClass);
  </script>
</body>
</html>
