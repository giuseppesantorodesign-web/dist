<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museo della Cultura e Musica Popolare dei Peloritani — Visita Virtuale</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --bg-dark: #0f1115;
      --bar-bg: #161920;
      --border-color: #262b36;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Sensore invisibile sul bordo alto sempre attivo */
    #top-hover-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 14px;
      z-index: 90;
      background: transparent;
    }

    /* Barra superiore sempre a scomparsa: scende solo quando si passa sul bordo alto */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background-color: rgba(22, 25, 32, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 12px;
      z-index: 100;
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    body.bar-visible header {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tab-btn, .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }

    .tab-btn:hover, .action-btn:hover {
      color: var(--text-main);
      border-color: #3f4756;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    main {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .panel {
      width: 100%;
      height: 100%;
      display: none;
    }

    .panel.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 820px) {
      header {
        height: auto;
        flex-wrap: wrap;
        padding: 8px 12px;
      }
      .brand {
        width: 100%;
      }
      nav {
        width: 100%;
        justify-content: space-between;
      }
      .tab-btn {
        flex: 1;
        justify-content: center;
        padding: 6px 8px;
        font-size: 12px;
      }
      .hide-mobile {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="top-hover-zone" aria-hidden="true"></div>

  <header id="top-bar">
    <div class="brand">
      <span class="brand-title">Museo della Cultura e Musica Popolare dei Peloritani</span>
      <span class="brand-sub">Allestimento e visita virtuale</span>
    </div>

    <nav aria-label="Sezioni progetto">
      <button type="button" class="tab-btn active" onclick="switchTab('figma', this)">
        1. Presentazione
      </button>
      <button type="button" class="tab-btn" onclick="switchTab('kuula', this)">
        2. Tour Virtuale 360°
      </button>
      <button type="button" class="tab-btn" onclick="switchTab('voyager', this)">
        3. Modello 3D
      </button>
      <button type="button" class="action-btn hide-mobile" onclick="toggleFullscreen()" title="Attiva o esci dallo schermo intero">
        ⛶ Schermo intero
      </button>
      <a id="open-direct" class="action-btn hide-mobile" href="https://www.figma.com/proto/KqdLDB4LGCvwLFYS1ZBOTz/Tesi_Museo-della-Cultura-e-Musica-Popolare-dei-Peloritani?node-id=1-1252&p=f&viewport=-3767%2C193%2C0.05&t=JDs3tVxNZFknNsGk-1&scaling=scale-down&content-scaling=fixed&starting-point-node-id=1%3A1252&page-id=0%3A1" target="_blank" rel="noopener" title="Apri la scheda corrente in una nuova finestra">
        Apri esterno ↗
      </a>
    </nav>
  </header>

  <main id="content-area">
    <!-- SEZIONE 1: FIGMA -->
    <section id="panel-figma" class="panel active">
      <iframe
        src="https://embed.figma.com/proto/KqdLDB4LGCvwLFYS1ZBOTz/Tesi_Museo-della-Cultura-e-Musica-Popolare-dei-Peloritani?node-id=1-1252&p=f&scaling=scale-down&content-scaling=fixed&starting-point-node-id=1%3A1252&page-id=0%3A1&embed-host=share&hide-ui=1"
        allowfullscreen>
      </iframe>
    </section>

    <!-- SEZIONE 2: KUULA -->
    <section id="panel-kuula" class="panel">
      <iframe
        id="frame-kuula"
        data-src="https://kuula.co/share/collection/7dZJG?logo=-1&info=0&fs=1&vr=1&initload=0&theme=000000ff&thumbs=-1"
        allow="xr-spatial-tracking; gyroscope; accelerometer; fullscreen"
        allowfullscreen
        scrolling="no">
      </iframe>
    </section>

    <!-- SEZIONE 3: VOYAGER 3D -->
    <section id="panel-voyager" class="panel">
      <iframe
        id="frame-voyager"
        data-src="https://giuseppesantorodesign-web.github.io/dist/voyager-explorer.html?root=models/tusk/&document=tusk.svx.json"
        allow="xr-spatial-tracking; fullscreen"
        allowfullscreen>
      </iframe>
    </section>
  </main>

  <script>
    const directUrls = {
      figma: "https://www.figma.com/proto/KqdLDB4LGCvwLFYS1ZBOTz/Tesi_Museo-della-Cultura-e-Musica-Popolare-dei-Peloritani?node-id=1-1252&p=f&viewport=-3767%2C193%2C0.05&t=JDs3tVxNZFknNsGk-1&scaling=scale-down&content-scaling=fixed&starting-point-node-id=1%3A1252&page-id=0%3A1",
      kuula: "https://kuula.co/share/collection/7dZJG?logo=-1&info=0&fs=1&vr=1&initload=0&theme=000000ff&thumbs=-1",
      voyager: "https://giuseppesantorodesign-web.github.io/dist/voyager-explorer.html?root=models/tusk/&document=tusk.svx.json"
    };

    let hideTimer = null;

    function showTopBar() {
      clearTimeout(hideTimer);
      document.body.classList.add("bar-visible");
    }

    function scheduleHideTopBar() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        document.body.classList.remove("bar-visible");
      }, 450);
    }

    function switchTab(tabName, clickedBtn) {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.remove("active");
      });
      if (clickedBtn) {
        clickedBtn.classList.add("active");
      }

      document.querySelectorAll(".panel").forEach((panel) => {
        panel.style.display = "none";
        panel.classList.remove("active");
      });

      const targetPanel = document.getElementById("panel-" + tabName);
      if (targetPanel) {
        targetPanel.style.display = "block";
        targetPanel.classList.add("active");
      }

      const frame = document.getElementById("frame-" + tabName);
      if (frame && !frame.getAttribute("src") && frame.dataset.src) {
        frame.setAttribute("src", frame.dataset.src);
      }

      const ext = document.getElementById("open-direct");
      if (ext && directUrls[tabName]) {
        ext.href = directUrls[tabName];
      }

      scheduleHideTopBar();
    }

    function toggleFullscreen() {
      const fsElement =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement;

      if (!fsElement) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (req) req.call(el).catch(() => {});
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
        if (exit) exit.call(document).catch(() => {});
      }
    }

    const hoverZone = document.getElementById("top-hover-zone");
    const topBar = document.getElementById("top-bar");

    if (hoverZone) {
      hoverZone.addEventListener("mouseenter", showTopBar);
    }
    if (topBar) {
      topBar.addEventListener("mouseenter", showTopBar);
      topBar.addEventListener("mouseleave", scheduleHideTopBar);
    }
  </script>
</body>
</html>
